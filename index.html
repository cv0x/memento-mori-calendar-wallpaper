<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Memento Mori</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="support" class="support">
      <svg class="support-heart" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
        <path
          d="M12 21s-7.5-4.6-9.6-9.3C.9 8.3 3 4.5 6.7 4.5c2.1 0 3.6 1.1 5.3 3 1.7-1.9 3.2-3 5.3-3 3.7 0 5.8 3.8 4.3 7.2C19.5 16.4 12 21 12 21z"
        />
      </svg>
      <div class="support-card">
        <p class="support-title">Support the creator</p>
        <img
          src="https://raw.githubusercontent.com/cv0x/Bitcoin-Real-Time-Price-Tracker/main/btcsupport.png"
          alt="Bitcoin address"
        />
      </div>
    </div>

    <main class="wallpaper">
      <div id="frame" class="frame">
        <header class="header">
          <div class="brand">
            <h1 id="title">MEMENTO MORI</h1>
            <p class="subtitle">One square is one week of your life</p>
          </div>
          <div id="stats" class="stats"></div>
        </header>

        <div id="progress" class="progress"><div id="progressBar"></div></div>

        <section id="calendar" class="calendar"></section>

        <footer class="footer">
          <div id="legend" class="legend">
            <span><i class="cell past"></i>Lived</span>
            <span><i class="cell current"></i>This week</span>
            <span><i class="cell"></i>Remaining</span>
          </div>
          <p id="quote" class="quote"></p>
        </footer>
      </div>
    </main>

    <script type="module" src="app.js"></script>
  </body>
</html>
